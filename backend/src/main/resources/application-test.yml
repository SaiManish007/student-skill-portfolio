spring:
  datasource:
    url: jdbc:h2:mem:skillfolio_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: SkillfolioTestingSecretKeyLongEnoughForHS256SecurityValidationRequirements2026
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  admin:
    bootstrap:
      enabled: false

logging:
  level:
    root: WARN
    com.skillfolio.portfolio: INFO
